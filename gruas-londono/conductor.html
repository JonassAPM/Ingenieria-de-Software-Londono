<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vista Conductor | Grúas Londoño</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="conductor-body">
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <header class="navbar conductor-navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-icon">GL</span>
        <span>Grúas Londoño</span>
      </a>
      <span class="conductor-title">Modo Conductor</span>
    </div>
  </header>

  <main class="container conductor-main">
    <section class="conductor-header">
      <h1>Órdenes asignadas</h1>
      <p>Actualiza el estado con un solo toque.</p>
    </section>

    <section id="conductor-lista" class="conductor-lista">
      <!-- Las tarjetas se generan dinámicamente -->
    </section>
  </main>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Utilidades -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/notifications.js"></script>

  <!-- Microservicio despacho -->
  <script src="js/firebase-config.js"></script>
  <script src="js/services/despacho/despacho.model.js"></script>
  <script src="js/services/despacho/despacho.view.js"></script>
  <script src="js/services/despacho/despacho.controller.js"></script>

  <!-- Orquestador -->
  <script src="js/app.js"></script>
</body>
</html>
